<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Aroma Cacao</title>
</head>
<body class="login-page d-flex align-items-center justify-content-center">

  <div class="card shadow border-0" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <i class="bi bi-box-seam display-4 text-primary"></i>
        <h1 class="h4 mt-2 mb-0">Aroma Cacao S.A.</h1>
        <small class="text-muted">Inventario de Mantenimiento</small>
      </div>

      <form action="dashboard.html">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="usuario@aromacacao.com" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>

    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
